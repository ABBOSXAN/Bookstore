{% extends 'base.html' %}

{% block title %}Books{% endblock %}

{% block content %}
<div class="card-group">
    {% for book in book_list %}
      <div class="card">
        <img src="{{ book.cover.url }}" class="card-img-top" alt="{{ book.title }}"
             style="height:300px; width:cover; padding:20px">
        <div class="card-body">
          <h2><a href="{{ book.get_absolute_url }}" class="btn btn-outline-primary" role="button">{{book.title}}</a></h2>
          <p class="card-text">This is book of them {{book.author}}</p>
          <p class="card-text"><small class="text-muted">Created: {{current_time}} </small></p>
        </div>
      </div>
    {% endfor %}
</div>
{% endblock %}
